seed: 42

data:
  raw_root: data/users/default
  processed_dir: data/processed
  manifest_path: data/processed/splits.json
  mapping_path: data/mapping.txt
  subject_mapping_path: data/subject_mapping.csv
  missing_subject_report: data/processed/missing_subject_mapping.csv
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  overwrite: false

split:
  # Use "video" only when subject identities truly are unavailable and the
  # resulting metrics are explicitly understood as video-level generalisation.
  strategy: subject

preprocessing:
  # Start with 4 on the 72-core shared server. Increase to 7 after one
  # successful real-data run while CPU and memory remain healthy.
  num_workers: 4
  target_fps: 15.0
  hand_side: R
  min_detection_confidence: 0.7
  quality_threshold: 0.6
  one_euro_min_cutoff: 1.0
  one_euro_beta: 0.007
  one_euro_d_cutoff: 1.0
  cache_dir: data/cache

mock:
  enabled: true
  output_dir: data/processed
  videos_per_split:
    train: 8
    validation: 3
    test: 3
  min_frames: 180
  max_frames: 240
  fps: 15.0
  miss_rate: 0.08
  noise_std: 0.04
