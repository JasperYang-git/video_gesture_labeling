seed: 42
device: auto

# Folder of recordings to annotate. Every directory holding an .mp4 becomes one
# sample; directory names may follow the ID_Sex_Side_Scene convention but do not
# have to, unparsed fields simply become "unknown".
video_root: videos

# Must match the training-time preprocessing, otherwise the checkpoint fingerprint
# check in utils/inference.py rejects the sequences.
extract:
  num_workers: 4
  physical_hand: right
  input_mirrored: false
  allow_opposite_hand_fallback: false
  handedness_threshold: 0.7
  max_num_hands: 2
  model_complexity: 1
  cache_dir: data/cache/tracks

assemble:
  # Deliberately not data/processed: unlabeled sequences must not be picked up by
  # build_experiment_manifest and leak into the training corpus.
  output_dir: data/processed_infer
  target_fps: 15.0
  one_euro_min_cutoff: 1.0
  one_euro_beta: 0.007
  one_euro_d_cutoff: 1.0

inference:
  model_path: outputs/best_model.pth
  window_size: 60
  stride: 12

# Optional filters applied to the model output. All default to no-ops. They run after
# inference only, so nothing here can cause train/test skew, and the raw prediction is
# always saved next to the filtered one. evaluate_script.py ignores this section on
# purpose: a class prior would hide the single-versus-double confusion worth seeing.
postprocess:
  # Restrict the argmax to these classes (names or ids); background is always allowed.
  # Use only when you know it for a fact, e.g. a recording session of double gestures:
  #   allowed_classes: [double-knock, double-tap, double-slide-up, double-slide-down, double-clench]
  allowed_classes: []
  # Drop action segments whose mean softmax probability is below this. Calibrate it on
  # a labeled split rather than guessing; 15 classes means chance is 0.067.
  min_confidence: 0.0
  # Drop action segments shorter than this. A real gesture lasts around 0.75s, so
  # anything near 0.2s is boundary jitter. Segments with the same class on both sides
  # are absorbed instead of blanked, to avoid splitting one gesture into two.
  min_duration_sec: 0.0

outputs:
  write_annotation: true
  write_timeline: true
  write_srt: true
  mux: false
  # Never clobber a hand-made gestures.annotation~; predictions land next to it as
  # gestures.pred.annotation~ unless this is turned on.
  overwrite_annotation: false
  write_quality_report: true
  # Same gate the training pipeline uses to reject videos (config_prepare.yaml
  # audit.quality_threshold), so the two are directly comparable. Inference only warns.
  quality_threshold: 0.6
  # Below this, dump annotated frames from the worst tracking gap so the camera angle
  # and occlusion can be judged by eye. Costs a few seconds per video.
  preview_threshold: 0.8
  root_dir: outputs/annotate_results
